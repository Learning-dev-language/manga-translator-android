workflows:
  android-build:
    name: Android APK Build
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      
